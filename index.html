<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrit AI Innovations Pvt. Ltd. | AI-Powered Skill Assessments</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary-color: #0b2559; /* Corporate Dark Blue */
            --accent-gradient: linear-gradient(135deg, #00bfa5 0%, #00e676 100%); /* Vibrant 3D Cyan-Green */
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --card-shadow: 0 20px 40px rgba(0,0,0,0.08);
            --hover-shadow: 0 30px 60px rgba(11, 37, 89, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-dark);
            background-color: #ffffff;
            line-height: 1.6;
        }

        /* 3D Glass Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-area {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .logo-area span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            margin-left: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: #00bfa5;
        }

        /* 3D Curved Hero Section */
        .hero {
            padding: 220px 8% 140px;
            background: radial-gradient(circle at 80% 20%, #1e3a8a 0%, #0f172a 100%);
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #ffffff;
            clip-path: ellipse(60% 100px at 50% 100px);
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 20px;
            max-width: 850px;
            margin: 0 auto 35px;
            opacity: 0.9;
            font-weight: 300;
        }

        .status-badge {
            background: rgba(0, 191, 165, 0.15);
            border: 1px solid #00bfa5;
            color: #00e676;
            padding: 10px 24px;
            border-radius: 50px;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 191, 165, 0.2);
            animation: pulse 2s infinite;
        }

        /* Vision Section */
        .vision {
            padding: 100px 8% 60px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .vision h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 36px;
            font-weight: 700;
        }

        /* 3D Features Grid */
        .features {
            background: var(--bg-light);
            padding: 100px 8%;
            text-align: center;
        }

        .features h2 {
            color: var(--primary-color);
            margin-bottom: 50px;
            font-size: 36px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 35px;
            perspective: 1000px; /* Crucial for 3D depth */
        }

        .card {
            background: #ffffff;
            padding: 45px 30px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform: style 3d;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(2deg);
            box-shadow: var(--hover-shadow);
        }

        .card i {
            font-size: 45px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 22px;
        }

        /* Executive Leadership Section (Directors Team) */
        .leadership {
            padding: 100px 8%;
            text-align: center;
            background: #ffffff;
        }

        .leadership h2 {
            color: var(--primary-color);
            font-size: 36px;
            margin-bottom: 15px;
        }

        .leadership-subtitle {
            color: #64748b;
            margin-bottom: 60px;
            font-size: 18px;
        }

        .team-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 35px;
            width: 320px;
            transition: all 0.4s ease;
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }

        .profile-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--hover-shadow);
        }

        .img-container {
            width: 180px;
            height: 180px;
            border-radius: 50px; /* Smooth square-round look */
            margin: 0 auto 25px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(11, 37, 89, 0.15);
            background: #f1f5f9;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h3 {
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 5px;
        }

        .profile-card .designation {
            color: #00bfa5;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .profile-card .bio {
            font-size: 14px;
            color: #64748b;
        }

        /* 3D CTA/Experience Box */
        .experience-banner {
            background: linear-gradient(135deg, #0b2559 0%, #1e3a8a 100%);
            color: white;
            padding: 60px 40px;
            border-radius: 24px;
            max-width: 1100px;
            margin: 40px auto 100px;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.3);
            position: relative;
            z-index: 1;
        }

        /* Footer */
        footer {
            background: #091326;
            color: #ffffff;
            padding: 60px 8% 40px;
            text-align: center;
            border-top: 4px solid #00bfa5;
        }

        .contact-info {
            margin: 30px 0;
            font-size: 20px;
        }

        .contact-info a {
            color: #00bfa5;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .contact-info a:hover {
            color: #00e676;
            text-decoration: underline;
        }

        .footer-text {
            opacity: 0.5;
            font-size: 14px;
            margin-top: 30px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            header { padding: 15px 5%; flex-direction: column; }
            nav { margin-top: 15px; }
            nav a { margin: 0 12px; font-size: 15px; }
            .hero h1 { font-size: 34px; }
            .team-container { gap: 30px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            AMRIT <span>AI</span>
        </div>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#features">Features</a>
            <a href="#leadership">Leadership</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="status-badge">
            <i class="fa-solid fa-layer-group"></i> 70% Completed — Launching Soon Nationwide
        </div>
        <h1>Amrit AI Innovations Pvt. Ltd.</h1>
        <p>भारतातील पहिली आणि एकमेव NSDC आधारित कौशल्य विकासासाठीची पूर्णपणे AI-Powered असेसमेंट सिस्टीम. आम्ही घेऊन येत आहोत पारदर्शकतेची एक नवीन डिजिटल क्रांती!</p>
    </section>

    <!-- About Section -->
    <section class="vision" id="about">
